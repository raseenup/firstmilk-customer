name: First Milk portal JavaScript syntax
on:
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - 'tests/**/*.cjs'
      - 'index.html'
      - 'product-information.css'
      - '.github/workflows/portal-features-ci.yml'
  pull_request:
    paths:
      - '**/*.js'
      - 'orders.css'
      - 'website/**'
      - 'tests/**/*.cjs'
      - 'assets/brand/**'
      - 'brand.css'
      - 'manifest.webmanifest'
      - 'index.html'
      - '.github/workflows/portal-features-ci.yml'
  workflow_dispatch:
jobs:
  javascript-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original and additive JavaScript
        run: |
          node --check 'app.js'
          node --check 'experience.js'
          node --check 'product-information.js'
          node --check 'customer-features.js'
          node --check 'orders.js'
          node --check 'website/cms.js'
          node --check 'website/chat.js'

      - name: Install browser-test dependencies
        run: npm install --no-save jsdom@27.2.0
      - name: Run shared portal browser tests
        run: node --test tests/official-brand.test.cjs tests/return-quality-ui.test.cjs tests/return-collection-ui.test.cjs tests/portal-core.test.cjs tests/returned-orders.test.cjs tests/product-information-ux.test.cjs website/tests/chat.test.cjs
