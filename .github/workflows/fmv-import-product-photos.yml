name: Import approved FMV dairy photos
on:
  push:
    branches:
      - feature/fmv-realistic-product-assets-20261122
    paths:
      - .github/workflows/fmv-import-product-photos.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out current website source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download approved First Milk Venture images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p website/assets/products
          curl -fLSs --retry 3 --max-time 90 --proto '=https' --tlsv1.2 'https://dynamic.heygen.ai/image/eb78ff30adb341fe831c1a1258e7801f/original.webp' -o website/assets/products/hero-milk-900.webp
          curl -fLSs --retry 3 --max-time 90 --proto '=https' --tlsv1.2 'https://dynamic.heygen.ai/image/60291e40f7564cddbedc180628a22f1b/original.webp' -o website/assets/products/hero-ghee-900.webp
          curl -fLSs --retry 3 --max-time 90 --proto '=https' --tlsv1.2 'https://dynamic.heygen.ai/image/17e0a8aa989b4ae0830ca32b64b3968f/original.webp' -o website/assets/products/hero-curd-900.webp
          curl -fLSs --retry 3 --max-time 90 --proto '=https' --tlsv1.2 'https://dynamic.heygen.ai/image/8560b9f4b23e45e68dd037d91b09d67c/original.webp' -o website/assets/products/hero-butter-900.webp
          # HeyGen's image delivery can serve JPEG/PNG despite the .webp URL.
          # Decode and re-encode into verified, self-hosted WebP to avoid
          # mislabeled content, reduce bytes, and remove embedded metadata.
          python -m pip install --disable-pip-version-check 'Pillow>=10.4,<12'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          directory=Path('website/assets/products')
          Image.MAX_IMAGE_PIXELS = 12_000_000
          for key in ('milk','ghee','curd','butter'):
              target=directory/f'hero-{key}-900.webp'
              assert 15_000 < target.stat().st_size < 5_000_000, f'{key}: unexpected source file size'
              with Image.open(target) as image:
                  image.verify()
              with Image.open(target) as original:
                  assert original.format in {'WEBP','PNG','JPEG'}, f'{key}: unsupported image'
                  assert 600 <= original.width <= 3000 and 600 <= original.height <= 3000, f'{key}: invalid dimensions'
                  source_format=original.format
                  normalized=ImageOps.exif_transpose(original).convert('RGB')
                  normalized.thumbnail((900,1350),Image.Resampling.LANCZOS)
                  out=target.with_suffix('.new.webp')
                  normalized.save(out,format='WEBP',quality=83,method=6)
              out.replace(target)
              with Image.open(target) as final:
                  assert final.format=='WEBP'
                  print(f'{key}: {source_format} -> WebP {final.width}x{final.height}, {target.stat().st_size} bytes')
          PY
      - name: Optimize mobile variants using Pillow
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=10.4,<12'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          folder=Path('website/assets/products')
          for name in ('milk','ghee','curd','butter'):
              full=folder/f'hero-{name}-900.webp'
              with Image.open(full) as pic:
                  assert pic.format=='WEBP' and max(pic.size)<=2000
                  pic.thumbnail((600,900),Image.Resampling.LANCZOS)
                  pic.save(folder/f'hero-{name}-600.webp','WEBP',quality=74,method=6)
          PY
      - name: Save durable website-hosted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/assets/products/hero-*.webp
          git diff --cached --quiet && exit 0
          git commit -m 'Import four optimized, self-hosted FMV product photos'
          git push origin HEAD:feature/fmv-realistic-product-assets-20261122
