<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Milk — Customer Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }</style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-12">

    <!-- DELETE THIS ENTIRE DIV FROM customer.html -->
  <div class="bg-slate-900 text-white px-4 py-2 sticky top-0 z-50 text-xs flex justify-between items-center shadow">
    <span class="font-bold text-blue-400">First Milk Customer Portal</span>
    <div class="space-x-2">
      <a href="driver.html" class="hover:underline text-slate-300">Driver</a>
      <a href="customer.html" class="underline font-bold text-blue-400">Customer</a>
      <a href="admin.html" class="hover:underline text-slate-300">Admin</a>
    </div>
  </div>

  <div class="max-w-3xl mx-auto p-4 sm:p-6 space-y-6">
    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
      <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-100 pb-4 mb-4">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider text-blue-600">First Milk Customer Dashboard</span>
          <h1 class="text-xl font-extrabold text-slate-900">My Active Orders & Delivery OTPs</h1>
          <p class="text-xs text-slate-500">Share your auto-generated 4-digit OTP with the driver upon doorstep delivery.</p>
        </div>
        <button onclick="openNewOrderModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">
          + Place New Order
        </button>
      </div>
      <div id="customer-orders-list" class="grid sm:grid-cols-2 gap-4"></div>
    </div>
  </div>

  <!-- New Order Modal -->
  <div id="new-order-modal" class="fixed inset-0 bg-slate-900/60 hidden items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl">
      <h3 class="text-base font-extrabold text-slate-900 mb-1">Place New Milk Order</h3>
      <p class="text-xs text-slate-500 mb-3">A unique 4-digit delivery OTP will be generated automatically.</p>
      <form onsubmit="createNewOrder(event)" class="space-y-3">
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Customer Name</label>
            <input type="text" id="ord-name" value="Tariq Al-Harbi" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Contact Number</label>
            <input type="text" id="ord-phone" value="+966 54 112 8890" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl" />
          </div>
        </div>
        <div class="grid grid-cols-3 gap-2.5">
          <div class="col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Product Name</label>
            <select id="ord-prod" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl">
              <option value="Fresh Farm Cow Milk (1L)">Fresh Farm Cow Milk (1L)</option>
              <option value="Organic A2 Milk (2L)">Organic A2 Milk (2L)</option>
              <option value="Fresh Laban Bottle (1L)">Fresh Laban Bottle (1L)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Qty</label>
            <input type="number" id="ord-qty" value="2" min="1" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Order Type</label>
            <select id="ord-type" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl">
              <option value="Subscribed">Subscribed</option>
              <option value="Single Purchase">Single Purchase</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Payment Status</label>
            <select id="ord-pay" class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl">
              <option value="COD Due">COD Due (SAR 24.00)</option>
              <option value="Paid Online">Paid Online</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Delivery Location</label>
          <input type="text" id="ord-loc" value="Al Hamra District, Jeddah" required class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl" />
        </div>
        <div class="flex gap-2 pt-2">
          <button type="submit" class="flex-1 bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">Generate Order & OTP</button>
          <button type="button" onclick="closeNewOrderModal()" class="px-4 bg-slate-100 font-bold py-2.5 rounded-xl text-xs">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script src="app-core.js"></script>
  <script>
    function renderCustomerApp() {
      const orders = getOrders();
      document.getElementById('customer-orders-list').innerHTML = orders.map(o => `
        <div class="border border-slate-200 rounded-2xl p-4 space-y-2.5 bg-slate-50/50">
          <div class="flex items-center justify-between">
            <span class="font-extrabold text-sm text-slate-900">Order #${o.id}</span>
            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${o.status === 'delivered' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}">
              ${o.status === 'delivered' ? 'Delivered' : 'Out for Delivery'}
            </span>
          </div>
          <div class="text-xs text-slate-600 space-y-1">
            <p><strong>Product:</strong> ${o.productName} (Qty: ${o.quantity})</p>
            <p><strong>Plan:</strong> ${o.orderType} | <strong>Payment:</strong> ${o.paymentStatus}</p>
            <p><strong>Address:</strong> ${o.location}</p>
          </div>
          <div class="bg-white border border-dashed border-blue-400 rounded-xl p-3 flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-600">Your Delivery OTP:</span>
            <span class="text-lg font-extrabold font-mono tracking-widest text-blue-700">${o.otp}</span>
          </div>
        </div>
      `).join("");
    }

    function openNewOrderModal() { document.getElementById('new-order-modal').classList.remove('hidden'); document.getElementById('new-order-modal').classList.add('flex'); }
    function closeNewOrderModal() { document.getElementById('new-order-modal').classList.add('hidden'); }

    function createNewOrder(e) {
      e.preventDefault();
      const payVal = document.getElementById('ord-pay').value;
      const isCod = payVal.startsWith('COD');
      const orders = getOrders();
      const nextId = orders.length > 0 ? Math.max(...orders.map(o => o.id)) + 1 : 1;
      
      orders.unshift({
        id: nextId,
        customerName: document.getElementById('ord-name').value,
        contactNumber: document.getElementById('ord-phone').value,
        productName: document.getElementById('ord-prod').value,
        quantity: Number(document.getElementById('ord-qty').value),
        orderType: document.getElementById('ord-type').value,
        paymentStatus: payVal,
        codAmount: isCod ? 24.00 : 0.00,
        location: document.getElementById('ord-loc').value,
        otp: Math.floor(1000 + Math.random() * 9000).toString(),
        status: 'pending',
        deliveredAt: null
      });
      saveOrders(orders);
      closeNewOrderModal();
      renderCustomerApp();
    }

    window.addEventListener('DOMContentLoaded', () => { renderCustomerApp(); });
  </script>
</body>
</html>
